<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EXIT BCN1</title>
<style>html,body{margin:0;height:100%;background:#0b1320;color:#cfd8e3;font:22px system-ui,Segoe UI,Arial}#m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw;gap:24px}
#f{display:none;flex-direction:column;align-items:center;gap:18px}#f.on{display:flex}input{font:36px monospace;letter-spacing:4px;text-align:center;padding:12px 20px;border-radius:12px;border:2px solid #4a6a99;background:#13233a;color:#fff;width:14ch;text-transform:lowercase}
button{font:26px system-ui;padding:12px 36px;border-radius:12px;border:0;background:#2d7ef7;color:#fff}#e{color:#ff8a80;min-height:1.4em}</style>
</head><body><div id="m"><div id="t">Cargando EXIT BCN1...</div>
<form id="f"><label for="c">Codigo de la pantalla</label><input id="c" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="submit">Entrar</button><div id="e"></div></form></div>
<script>
(function () {
  // Pagina publica de arranque de la pantalla EXIT BCN1. No contiene datos: pide un codigo una vez (queda guardado en el navegador)
  // y con el baja el codigo real de la pantalla desde Firebase. Sin codigo no se ve nada; Firebase rechaza lecturas sin clave.
  var DB = 'https://tom-yard-default-rtdb.europe-west1.firebasedatabase.app';
  var tv = !/[?&]clerk=1/.test(location.search); // por defecto modo pantalla; ?clerk=1 para el puesto del clerk
  var t = document.getElementById('t'), f = document.getElementById('f'), c = document.getElementById('c'), e = document.getElementById('e');
  function get(url, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), true); x.timeout = 15000;
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        var ok = x.status >= 200 && x.status < 300, data = null;
        try { data = ok ? JSON.parse(x.responseText) : null; } catch (err) { ok = false; }
        cb(ok, data, x.status);
      };
      x.send();
    } catch (err) { cb(false, null, 0); }
  }
  function arrancar(app, foto) {
    var html = app.replace('__EXIT_CFG__', JSON.stringify({ key: app_key(app), tv: tv })).replace('__EXIT_FOTO__', foto || '');
    document.open(); document.write(html); document.close();
  }
  function app_key(app) { var m = /__EXIT_KEY__=([A-Za-z0-9_\-]+)/.exec(app); return m ? m[1] : ''; }
  var cache = null, code = '';
  try { cache = JSON.parse(localStorage.getItem('exit_cache') || 'null'); code = localStorage.getItem('exit_code') || ''; } catch (err) {}
  var intentos = 0;
  function pedirCodigo(msg) { t.textContent = 'EXIT BCN1'; f.className = 'on'; e.textContent = msg || ''; try { c.focus(); } catch (err) {} }
  function cargar(nuevo) {
    intentos++;
    var base = DB + '/exitpub/' + encodeURIComponent(code);
    get(base + '/app.json', function (ok, app, st) {
      if (ok && typeof app === 'string' && app.indexOf('__EXIT_CFG__') > 0) {
        try { localStorage.setItem('exit_code', code); } catch (err) {}
        if (cache && cache.app === app && cache.foto) return arrancar(cache.app, cache.foto);
        get(base + '/foto.json', function (ok2, foto) {
          if (!ok2 || typeof foto !== 'string') foto = cache && cache.foto || '';
          try { localStorage.setItem('exit_cache', JSON.stringify({ app: app, foto: foto, ts: Date.now() })); } catch (err) {}
          arrancar(app, foto);
        });
        return;
      }
      if (st === 401 || st === 403 || (ok && app === null)) return pedirCodigo(nuevo ? 'Codigo incorrecto' : '');
      if (cache && cache.app) return arrancar(cache.app, cache.foto);
      f.className = ''; t.textContent = 'Sin conexion con Firebase (intento ' + intentos + '). Reintentando...';
      setTimeout(function () { cargar(false); }, 15000);
    });
  }
  f.addEventListener('submit', function (ev) { ev.preventDefault(); code = c.value.trim().toLowerCase(); if (!code) return; t.textContent = 'Comprobando...'; f.className = ''; cargar(true); });
  if (code) cargar(false); else pedirCodigo('');
})();
</script></body></html>
