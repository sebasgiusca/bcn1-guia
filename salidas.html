<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salidas BCN1</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1220;color:#fff;font-family:Arial,Helvetica,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:#111a2e;border-bottom:3px solid #ff9900}
  h1{margin:0;font-size:28px;letter-spacing:1px}
  h1 small{color:#ff9900;font-size:16px;margin-left:10px;font-weight:normal}
  #estado{font-size:16px;display:flex;align-items:center;gap:8px}
  #punto{width:14px;height:14px;border-radius:50%;background:#7f8c8d;display:inline-block}
  #punto.ok{background:#2ecc71}#punto.mal{background:#e74c3c;animation:par 1s infinite}
  @keyframes par{50%{opacity:.25}}
  main{padding:22px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .card{background:#16223c;border:3px solid #2b3d66;border-radius:16px;padding:18px 20px;text-align:center}
  .card.nuevo{animation:flash 3s ease-in-out 2;border-color:#ff9900}
  @keyframes flash{50%{background:#5c3d10}}
  .lbl{font-size:18px;color:#9fb3d9}
  .num{white-space:nowrap;font-size:84px;font-weight:bold;line-height:1.1;margin:6px 0;letter-spacing:2px}
  .matr{font-size:34px;font-weight:bold;letter-spacing:4px;color:#ffd166;margin:0 0 8px}
  .cuando{font-size:18px;color:#9fb3d9;margin-bottom:10px}
  .card.alerta{animation:alerta 1.6s ease-in-out infinite;border-color:#ffb3ab;border-width:6px;background:#b0001f;color:#fff}
  @keyframes alerta{0%,100%{background:#b0001f;box-shadow:0 0 22px 4px rgba(255,60,60,.65)}50%{background:#4a0812;box-shadow:0 0 0 0 rgba(255,60,60,0)}}
  .card.alerta .lbl,.card.alerta .cuando,.card.alerta .matr{color:inherit}
  body.hayAlerta header{background:#9a1226}
  #btnSonido{margin-right:14px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:600 16px/1 inherit;cursor:pointer;opacity:.75}
  #btnSonido.on{opacity:1;background:#1f7a3a;border-color:#1f7a3a}
  #btnSonido.pide{animation:pide 1s infinite alternate}
  #capaSonido{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:700 clamp(28px,5vw,64px)/1.2 inherit;cursor:pointer}
  #capaSonido div{background:#f0ad2c;color:#111;padding:28px 44px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  @keyframes pide{from{background:#b7791f}to{background:#f0ad2c}}
  
  .card.viejo{border-color:#e74c3c}.card.viejo .cuando{color:#ff8a80}
  button.quitar{width:100%;font-size:20px;padding:12px;border:0;border-radius:10px;background:#2ecc71;color:#06280f;font-weight:bold;cursor:pointer}
  #vacio{text-align:center;color:#6c7fa8;font-size:34px;margin-top:12vh}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;font-size:16px}
  #toast button{margin-left:12px;padding:4px 10px;border:0;border-radius:6px;background:#ff9900;cursor:pointer;font-weight:bold}
  #anunciar{display:flex;gap:10px;margin:0 0 20px}
  #anunciar input{flex:1;max-width:340px;font-size:26px;padding:10px 14px;border-radius:10px;border:2px solid #2b3d66;background:#16223c;color:#fff;text-transform:uppercase}
  #anunciar button{font-size:22px;padding:10px 22px;border:0;border-radius:10px;background:#ff9900;color:#000;font-weight:bold;cursor:pointer}
  #anunciar small{align-self:center;color:#6c7fa8}
  #mapa{margin:0 0 22px;background:#111a2e;border:2px solid #2b3d66;border-radius:14px;padding:12px 16px}
  #mapa summary{cursor:pointer;font-size:20px;font-weight:bold;color:#ff9900;outline:none}
  #mapa h3{margin:14px 0 6px;font-size:14px;color:#9fb3d9;letter-spacing:1px;text-transform:uppercase}
  .tiles{display:flex;flex-wrap:wrap;gap:6px}
  .tile{min-width:68px;padding:12px 6px;font-size:16px;font-weight:bold;border:2px solid #2b3d66;border-radius:8px;background:#16223c;color:#fff;cursor:pointer}
  .tile.ps{border-color:#b58a3d}
  .tile.ib{border-color:#3d6fb5}.tile.ob{border-color:#4a8a5c}
  .tile.sel{background:#ff9900;color:#000;border-color:#ff9900;transform:scale(1.08)}
  .tile.on{background:#7a1f1f;border-color:#e74c3c;color:#ffb3ad;cursor:default}
  #confirma{margin-top:12px;font-size:18px;color:#ff9900;min-height:24px}
  body.tv #mapa{display:none}
  body.tv #anunciar{display:none}
  body.tv{cursor:none}
  /* TV: todo cabe en pantalla sin desplazarse; columnas y tamanos segun el numero de avisos (--cols/--rows los pone JS) */
  body.tv{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  body.tv header{padding:1vh 2vw;flex:0 0 auto}
  body.tv main{flex:1 1 auto;min-height:0;padding:1.5vh 1.5vw;display:flex;flex-direction:column}
  body.tv #grid{flex:1 1 auto;min-height:0;grid-template-columns:repeat(var(--cols,1),1fr);grid-auto-rows:1fr;gap:1.5vh 1.5vw}
  body.tv .card{display:flex;flex-direction:column;justify-content:center;padding:1vh 1vw;min-height:0;overflow:hidden}
  body.tv .num{font-size:min(calc(80vw / var(--cols,1) / 3.4), calc(42vh / var(--rows,1)));margin:0;letter-spacing:.03em}
  body.tv .matr{font-size:min(calc(80vw / var(--cols,1) / 7), calc(16vh / var(--rows,1)));margin:0;letter-spacing:.1em}
  body.tv .lbl,body.tv .cuando{font-size:min(calc(80vw / var(--cols,1) / 14), calc(8vh / var(--rows,1)));margin:0}
  body.tv #vacio{font-size:6vh}
  body.tv button.quitar,body.tv #toast{display:none!important}
  body.tv h1{font-size:4.5vh}body.tv h1 small{font-size:2vh}body.tv #estado,body.tv #btnSonido{font-size:2vh}
</style>
</head>
<body>
<header>
  <h1>Salidas <b>BCN1</b><small id="modo"></small></h1>
  <div id="estado"><button id="btnSonido" type="button" title="Sonido al aparecer un aviso">&#128264; Sonido</button><span id="punto"></span><span id="txt">Conectando...</span></div>
</header>
<main>
  <div id="anunciar"><input id="muelle" placeholder="Muelle o plaza (172, IB110, PS559)" maxlength="10" autocomplete="off"><button id="btnAnunciar">ANUNCIAR</button><small id="anHint"></small></div>
  <details id="mapa" open><summary>Llamar desde el mapa</summary>
    <h3>Inbound (descargas)</h3><div class="tiles" id="tIB"></div>
    <h3>Outbound (cargas)</h3><div class="tiles" id="tOB"></div>
    <h3>Plazas de tractora (PS)</h3><div class="tiles" id="tPS"></div>
    <div id="confirma">Pulsa un muelle y vuelve a pulsarlo para llamar. Plazas PS/PC: escribelas arriba.</div>
  </details>
  <div id="capaSonido" style="display:none"><div>&#128266;<br>Toca la pantalla para activar el sonido</div></div>
  <div id="grid"></div>
  <div id="vacio" style="display:none">Sin salidas pendientes</div>
</main>
<div id="toast"></div>
<script>
(function () {
  var DB = 'https://tom-yard-default-rtdb.europe-west1.firebasedatabase.app';
  var POLL_MS = 5000, MAX_AGE = 2 * 3600 * 1000, VIEJO_MIN = 15, ALERTA_MIN = 3, ultimoHtml = '';
  var tv = /[?&]tv=1/.test(location.search);
  if (tv) document.body.classList.add('tv');
  document.getElementById('modo').textContent = tv ? 'pantalla' : 'clerk';

  var okTs = 0, bootTs = Date.now(), visto = {}, primera = true, deshacer = null;
  var grid = document.getElementById('grid'), vacio = document.getElementById('vacio');
  var punto = document.getElementById('punto'), txt = document.getElementById('txt');

  function http(method, url, body, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open(method, url, true);
      x.timeout = 8000;
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        var ok = x.status >= 200 && x.status < 300, data = null;
        try { data = ok && x.responseText ? JSON.parse(x.responseText) : null; } catch (e) { ok = false; }
        cb(ok, data);
      };
      x.send(body == null ? null : JSON.stringify(body));
    } catch (e) { cb(false, null); }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hora(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function pintar(board) {
    var now = Date.now(), lista = [];
    Object.keys(board || {}).forEach(function (vr) {
      var b = board[vr];
      if (!b || typeof b.door !== 'string' || !b.door) return;
      var ts = Number(b.ts); // board se escribe sin auth: solo ts numerico (evita NaN e inyeccion en data-ts)
      if (!isFinite(ts) || ts <= 0) return;
      if (now - ts > MAX_AGE) return;
      if (b.done && b.done >= ts) return;
      lista.push({ vr: vr, door: b.door, ts: ts, plate: typeof b.plate === 'string' ? b.plate : '' });
    });
    lista.sort(function (a, b) { return a.ts - b.ts; });
    var html = '', nuevos = 0;
    lista.forEach(function (it) {
      var min = Math.max(0, Math.round((now - it.ts) / 60000));
      var clave = it.vr + '|' + it.ts, nuevo = !primera && !visto[clave];
      if (nuevo) nuevos++;
      visto[clave] = 1;
      html += '<div class="card' + (nuevo ? ' nuevo' : '') + (min >= VIEJO_MIN ? ' viejo' : '') + (now - it.ts >= ALERTA_MIN * 60000 ? ' alerta' : '') + '">' +
        '<div class="lbl">Muelle</div><div class="num">' + esc(it.door) + '</div>' +
        (it.plate ? '<div class="matr">' + esc(it.plate) + '</div>' : '') +
        '<div class="cuando">Llamado ' + hora(it.ts) + ' · hace ' + min + ' min</div>' +
        '<button class="quitar" data-vr="' + esc(it.vr) + '" data-ts="' + esc(it.ts) + '">Ya está</button></div>';
    });
    if (nuevos > 0 && !primera) sonar();
    primera = false;
    try { var hay = html.indexOf('alerta') > -1; document.body.classList[hay ? 'add' : 'remove']('hayAlerta'); } catch (e) {}
    if (html !== ultimoHtml) { grid.innerHTML = html; ultimoHtml = html; }
    if (tv) { // columnas segun avisos: 1 -> 1, 2-4 -> 2, 5-9 -> 3, mas -> 4
      var n = lista.length, cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4, rows = Math.max(1, Math.ceil(n / cols));
      grid.style.setProperty('--cols', cols); grid.style.setProperty('--rows', rows);
    }
    vacio.style.display = lista.length ? 'none' : 'block';
  }

  function quitar(vr, ts) {
    var antes = board_ultimo && board_ultimo[vr] && board_ultimo[vr].done || null;
    var done = Math.max(Date.now(), Number(ts) + 1 || 0); // el reloj de este PC puede ir atrasado respecto al de ODM: done siempre >= ts
    http('PUT', DB + '/board/' + encodeURIComponent(vr) + '/done.json', done, function (ok) {
      if (!ok) { aviso('No se pudo marcar. Reintenta.'); return; }
      if (board_ultimo && board_ultimo[vr]) board_ultimo[vr].done = done;
      pintar(board_ultimo); marcar();
      deshacer = { vr: vr, antes: antes };
      aviso('Quitado ' + (board_ultimo[vr] ? board_ultimo[vr].door : ''), true);
    });
  }
  var board_ultimo = null, toastT = null;
  if (/[?&]demo=1/.test(location.search)) window.__pintar = pintar; // solo pruebas: pintar un board de ejemplo desde la consola
  // ---- Sonido al aparecer un aviso nuevo (WebAudio; el navegador exige un toque en la pagina tras cada carga) ----
  var audioCtx = null, sonidoOn = true; // siempre con sonido (solo se apaga a mano con el boton)
  try { sonidoOn = localStorage.getItem('salidas_sonido') !== '0'; } catch (e) {}
  var btnSonido = document.getElementById('btnSonido');
  var capa = document.getElementById('capaSonido');
  function pintarSonido() {
    capa.style.display = (sonidoOn && !(audioCtx && audioCtx.state === 'running')) ? 'flex' : 'none';
    btnSonido.className = sonidoOn ? (audioCtx && audioCtx.state === 'running' ? 'on' : 'pide') : '';
    btnSonido.innerHTML = sonidoOn ? (audioCtx && audioCtx.state === 'running' ? '&#128266; Sonido ON' : '&#128266; Toca para activar el sonido') : '&#128263; Sonido OFF';
  }
  function activarAudio() {
    if (!sonidoOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state !== 'running') audioCtx.resume().then(pintarSonido, pintarSonido);
    } catch (e) {}
    pintarSonido();
  }
  function tono(t0, f, dur) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.6, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function sonar() {
    if (!sonidoOn || !audioCtx || audioCtx.state !== 'running') return;
    try { var t = audioCtx.currentTime; tono(t, 880, 0.35); tono(t + 0.4, 1175, 0.35); tono(t + 0.8, 880, 0.35); tono(t + 1.2, 1175, 0.6); } catch (e) {}
  }
  btnSonido.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!sonidoOn || (audioCtx && audioCtx.state === 'running')) sonidoOn = !sonidoOn; // 1er toque: activa; si ya suena, apaga
    try { localStorage.setItem('salidas_sonido', sonidoOn ? '1' : '0'); } catch (e) {}
    activarAudio(); if (sonidoOn && audioCtx) setTimeout(sonar, 150);
  });
  document.addEventListener('pointerdown', function () { if (sonidoOn && !(audioCtx && audioCtx.state === 'running')) { activarAudio(); setTimeout(pintarSonido, 300); } }, true);
  capa.addEventListener('click', function () { activarAudio(); setTimeout(pintarSonido, 300); });
  pintarSonido();

  function aviso(t, conDeshacer) {
    var el = document.getElementById('toast');
    el.innerHTML = esc(t) + (conDeshacer ? '<button id="undo">Deshacer</button>' : '');
    el.style.display = 'block';
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.style.display = 'none'; }, 8000);
    var u = document.getElementById('undo');
    if (u) u.onclick = function () {
      if (!deshacer) return;
      var d = deshacer; deshacer = null;
      var url = DB + '/board/' + encodeURIComponent(d.vr) + '/done.json';
      http(d.antes == null ? 'DELETE' : 'PUT', url, d.antes == null ? null : d.antes, function () { el.style.display = 'none'; leer(); });
    };
  }
  grid.addEventListener('click', function (e) {
    var b = e.target; if (!b.getAttribute || !b.getAttribute('data-vr')) return;
    quitar(b.getAttribute('data-vr'), b.getAttribute('data-ts'));
  });

  function enPantalla(v) {
    var ya = false;
    Object.keys(board_ultimo || {}).forEach(function (k) { var b = board_ultimo[k]; if (b && b.door === v && !(b.done && b.done >= b.ts) && Date.now() - b.ts < MAX_AGE) ya = true; });
    return ya;
  }
  function enviar(v, hint, despues) {
    if (enPantalla(v)) { hint.textContent = v + ' ya esta en pantalla'; return; }
    var now = Date.now(), id = 'M' + now + Math.random().toString(36).slice(2, 6);
    http('PUT', DB + '/board/' + id + '.json', { door: v, ts: now }, function (ok) {
      if (!ok) { hint.textContent = 'No se pudo enviar. Reintenta.'; return; }
      hint.textContent = 'Enviado: ' + v; if (despues) despues(); leer();
    });
  }
  function anunciar() {
    var inp = document.getElementById('muelle'), hint = document.getElementById('anHint');
    var v = String(inp.value || '').toUpperCase().replace(/\s+/g, '');
    if (/^\d{1,4}$/.test(v)) v = 'OB' + v;
    if (!/^[A-Z]{2}\d{1,4}$/.test(v)) { hint.textContent = 'Escribe muelle o plaza valido (172, IB110, PS559)'; return; }
    enviar(v, hint, function () { inp.value = ''; });
  }
  var seleccion = null;
  function montarMapa() {
    function tiles(id, pref, desde, hasta, cls) {
      var h = '';
      for (var n = desde; n <= hasta; n++) h += '<button class="tile ' + cls + '" data-d="' + pref + n + '">' + pref + n + '</button>';
      document.getElementById(id).innerHTML = h;
    }
    tiles('tIB', 'IB', 107, 122, 'ib');
    tiles('tOB', 'OB', 123, 173, 'ob');
    tiles('tPS', 'PS', 558, 563, 'ps');
    document.getElementById('mapa').addEventListener('click', function (e) {
      var b = e.target, d = b.getAttribute && b.getAttribute('data-d'); if (!d) return;
      var c = document.getElementById('confirma');
      if (enPantalla(d)) { c.textContent = d + ' ya esta en pantalla'; return; }
      if (seleccion === d) {
        seleccion = null; c.textContent = 'Enviando ' + d + '...';
        enviar(d, c, function () { marcar(); });
      } else { seleccion = d; c.textContent = 'Pulsa otra vez ' + d + ' para llamar'; marcar(); }
    });
  }
  function marcar() {
    var t = document.querySelectorAll('.tile');
    for (var i = 0; i < t.length; i++) {
      var d = t[i].getAttribute('data-d'), on = enPantalla(d);
      t[i].className = 'tile ' + (d.slice(0, 2) === 'IB' ? 'ib' : d.slice(0, 2) === 'PS' ? 'ps' : 'ob') + (on ? ' on' : (d === seleccion ? ' sel' : ''));
    }
  }
  montarMapa();
  document.getElementById('btnAnunciar').addEventListener('click', anunciar);
  document.getElementById('muelle').addEventListener('keydown', function (e) { if (e.key === 'Enter') anunciar(); });

  var leyendo = 0;
  function leer(reintento) {
    if (leyendo && Date.now() - leyendo < 12000) return;
    leyendo = Date.now();
    http('GET', DB + '/board.json?t=' + Date.now(), null, function (ok, data) {
      leyendo = 0;
      if (ok) { okTs = Date.now(); board_ultimo = data || {}; pintar(board_ultimo); marcar(); }
      else if (!reintento) setTimeout(function () { leer(true); }, 1500);
      estado();
    });
  }
  function estado() {
    var seg = okTs ? Math.round((Date.now() - okTs) / 1000) : null;
    if (seg !== null && seg <= 30) { punto.className = 'ok'; txt.textContent = 'Conectado · actualizado hace ' + seg + ' s'; }
    else { punto.className = 'mal'; txt.textContent = okTs ? 'SIN CONEXIÓN desde hace ' + seg + ' s' : 'Sin conexión con Firebase'; }
    var escribiendo = !tv && document.getElementById('muelle').value;
    var sinDatos = okTs ? Date.now() - okTs : Date.now() - bootTs;
    if (sinDatos > (tv ? 90000 : 240000) && !escribiendo && !seleccion) location.reload();
    if (Date.now() - bootTs > 12 * 3600 * 1000) location.reload();
  }
  try {
    window.addEventListener('online', function () { leer(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) leer(); });
  } catch (e) {}
  setInterval(leer, POLL_MS);
  setInterval(function () { if (board_ultimo) pintar(board_ultimo); estado(); }, 1000);
  leer();
})();
</script>
</body>
</html>
