<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BCN1 - Guía para camioneros</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #131A22;
    color: #f2f2f2;
  }
  header {
    background: #131A22;
    color: #ffffff;
    padding: 10px 16px 12px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.3px;
    position: relative;
    border-bottom: 4px solid #ff9900;
  }
  .amz-logo {
    width: 120px;
    height: 36px;
    display: block;
    margin: 0 auto 2px;
  }
  .lang-chip { position: absolute; top: 10px; right: 10px; background: #ff9900; color: #131A22; border: 2px solid #fff; border-radius: 22px; padding: 8px 14px; font-size: 17px; font-weight: 800; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .lang-bar.collapsed { display: none; }
  .toca-idioma { text-align: center; color: #ff9900; font-weight: 700; font-size: 17px; padding: 12px 16px 0; }
  .toca-idioma.collapsed { display: none; }
  .lang-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .lang-btn {
    padding: 8px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: 8px;
    border: 1px solid #37475A;
    background: #232F3E;
    color: #cfd3da;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .lang-btn.active {
    background: #ff9900;
    color: #131A22;
    border-color: #ff9900;
  }
  .panel {
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #cfd3da;
  }
  select, button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    margin-bottom: 12px;
  }
  select {
    background: #232F3E;
    color: #fff;
    border: 1px solid #37475A;
  }
  button {
    background: #ff9900;
    color: #131A22;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  #map { position: absolute; inset: 0; z-index: 1; background: #1b2430; }
  .map-wrap .map-controls { z-index: 1000; }
  .map-wrap .map-hint { z-index: 1000; }
  .geo-lbl { background: rgba(0,0,0,.7); color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 3px; border: 0; box-shadow: none; white-space: nowrap; }
  .geo-lbl.big { font-size: 13px; font-weight: 800; background: #0b57d0; }
  .geo-lbl.poi { font-size: 11px; font-weight: 700; background: #b3261e; }
  .geo-lbl.ok { background: #067D62; }
  .leaflet-tooltip-top:before { display: none; }
  .leaflet-container { font-family: inherit; }
  .map-wrap {
    position: relative;
    max-width: 480px;
    height: 55vh;
    max-height: 460px;
    margin: 0 auto;
    border: 2px solid #37475A;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    touch-action: none;
    background: #0F1111;
  }
  .map-wrap.show { display: block; }
  .map-inner {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform;
    cursor: grab;
  }
  .map-inner.dragging { cursor: grabbing; }
  .map-inner img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .map-inner svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .map-controls {
    position: absolute;
    right: 10px; bottom: 10px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 5;
  }
  .map-controls button {
    width: 38px; height: 38px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    margin: 0;
    background: #232F3E;
    color: #fff;
    border: 1px solid #37475A;
  }
  .map-hint {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(20,24,31,0.75);
    color: #cfd3da;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    z-index: 5;
  }
  .marker-label {
    fill: #fff;
    font-size: 22px;
    font-weight: 700;
    paint-order: stroke;
    stroke: #000;
    stroke-width: 4px;
  }
  .stepper {
    max-width: 480px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    overflow-x: auto;
    gap: 6px;
  }
  .pill {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    background: #232F3E;
    color: #6b7280;
    border: 1px solid #37475A;
  }
  .pill.done { background: #0B3D2E; color: #3DDC97; border-color: #067D62; }
  .pill.actual { background: #ff9900; color: #131A22; border-color: #ff9900; }
  .steps {
    max-width: 480px;
    margin: 12px auto 0;
    background: #232F3E;
    border-radius: 10px;
    padding: 4px 16px;
    display: none;
  }
  .steps.show { display: block; }
  .steps h3 { color: #ff9900; margin-top: 14px; }
  .steps ol { padding-left: 20px; }
  .steps li { margin-bottom: 10px; line-height: 1.4; }
  .badge {
    display: inline-block;
    background: #ff9900;
    color: #131A22;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
    margin-right: 6px;
  }
  .badge.carril { background: #067D62; color: #3DDC97; }
  .timer {
    font-size: 26px;
    font-weight: 700;
    color: #00A8E1;
    margin: 8px 0;
  }
  .tomyard-box {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 16px;
  }
  .tomyard-line {
    background: #232F3E;
    border: 1px solid #37475A;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    color: #cfd3da;
    margin-bottom: 8px;
  }
  .tomyard-call {
    background: #3a1f1f;
    border: 1px solid #ff9900;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 700;
    color: #ffb84d;
    animation: tomyardPulse 1.2s infinite;
  }
  @keyframes tomyardPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .demo-controls {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
  }
  .demo-controls button {
    margin-bottom: 0;
    background: #232F3E;
    color: #ff9900;
    border: 1px solid #ff9900;
    font-size: 13px;
    padding: 10px;
  }
  .sub-nav { display: flex; gap: 8px; margin-top: 14px; }
  .sub-nav button { flex: 1; margin: 0; padding: 14px 10px; font-size: 16px; font-weight: 800; border-radius: 12px; }
  .sub-nav .sub-fin { background: #067D62; color: #fff; }
  .sub-nav .sub-back { flex: 0 0 auto; background: #232F3E; color: #c7d0dc; border: 1px solid #37475A; font-size: 14px; font-weight: 600; }
  .vr-fixed { font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #ff9900; background: #0F1111; border: 2px solid #ff9900; border-radius: 12px; padding: 12px 16px; text-align: center; margin: 6px 0 12px; }
  .modo-nota {
    font-size: 11px;
    color: #6b7280;
    text-align: center;
    margin-top: 4px;
  }
  .safety-gate {
    max-width: 480px;
    margin: 16px auto 0;
    padding: 0 16px;
  }
  .gate-vrid {
    text-align: center;
    font-size: 13px;
    color: #ff9900;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .gate-map {
    background: #12151b;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 14px;
    text-align: center;
  }
  .gate-map img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 6px;
  }
  .gate-map-caption {
    font-size: 11px;
    color: #6b7280;
    margin-top: 6px;
  }
  .safety {
    padding: 14px 16px;
    background: #2a2210;
    border: 1px solid #7a5c1e;
    border-radius: 10px;
  }
  .safety h4 {
    margin: 0 0 8px 0;
    color: #ffcc66;
    font-size: 16px;
    text-align: center;
  }
  .safety-header {
    margin: 0 0 12px 0;
    font-size: 12px;
    line-height: 1.4;
    color: #ffcc66;
    background: #1f1a0c;
    border: 1px solid #5c4415;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .safety ol {
    margin: 0;
    padding-left: 20px;
  }
  .safety li {
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.45;
    color: #f0e6cf;
  }
  .safety-footer {
    margin: 12px 0 0 0;
    font-size: 12px;
    line-height: 1.4;
    color: #d8cba6;
    border-top: 1px solid #5c4415;
    padding-top: 10px;
  }
  .btn-confirmar {
    display: block;
    width: 100%;
    margin: 14px 0 24px;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    background: #ff9900;
    color: #11141a;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-confirmar:active { background: #FA8900; }
  .disclaimer {
    max-width: 480px;
    margin: 24px auto 40px;
    padding: 0 16px;
    font-size: 12px;
    color: #6b7280;
    text-align: center;
  }
.fb-box { max-width: 720px; margin: 14px auto 0; background: #232F3E; border-radius: 12px; padding: 14px 16px; text-align: center; }
.fb-box h4 { margin: 0 0 10px; font-size: 16px; }
.fb-faces { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
.fb-face { flex: 1; max-width: 120px; background: #37475A; border: 2px solid transparent; border-radius: 12px; padding: 8px 4px; cursor: pointer; color: #fff; font-size: 13px; }
.fb-face span { display: block; font-size: 30px; }
.fb-face.sel { border-color: #ff9900; background: #0F1111; }
.fb-box textarea, .assist-card textarea { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #37475A; background: #0F1111; color: #fff; padding: 8px; font-size: 14px; resize: vertical; margin-bottom: 8px; font-family: inherit; }
.fb-box button.fb-send, .as-send { background: #ff9900; color: #0F1111; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; }
.fb-box button.fb-send:disabled, .as-send:disabled { opacity: .45; cursor: default; }
.fb-thanks { color: #3DDC97; font-weight: 600; }
[dir="rtl"] .panel, [dir="rtl"] .fb-box, [dir="rtl"] .assist-card { text-align: right; }
[dir="rtl"] #btnAssist { right: auto; left: 14px; }
#btnAssist { position: fixed; right: 12px; bottom: 12px; z-index: 900; width: 52px; height: 52px; background: #c7254e; color: #fff; border: 2px solid #fff; border-radius: 50%; padding: 0; font-size: 22px; line-height: 48px; text-align: center; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.45); cursor: pointer; opacity: .85; }
#btnAssist.sent { background: #067D62; }
#btnAssist .lbl { display: none; }
#geoOverlay { position: fixed; inset: 0; z-index: 9400; background: rgba(15,17,17,.85); display: flex; align-items: center; justify-content: center; padding: 16px; }
#geoChip { position: absolute; left: 8px; bottom: 8px; z-index: 900; background: rgba(15,17,17,.85); color: #fff; font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; pointer-events: none; max-width: 85%; }
#geoChip.out { background: rgba(217,72,15,.9); }
.geo-dot { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 2px #1a73e8, 0 0 12px rgba(26,115,232,.8); }
#lockOverlay { position: fixed; inset: 0; z-index: 9900; background: #131A22; display: flex; align-items: center; justify-content: center; padding: 20px; }
.lock-card { max-width: 420px; text-align: center; color: #fff; }
.lock-vr { font-family: monospace; font-size: 22px; font-weight: 800; color: #ff9900; letter-spacing: 2px; margin-bottom: 18px; }
.lock-icon { font-size: 56px; margin-bottom: 10px; }
.lock-card .assist-title { font-size: 22px; }
.lock-card .assist-desc { color: #c7d0dc; font-size: 15px; line-height: 1.45; }
.lock-en { margin-top: 18px; font-size: 12px; color: #8a97a8; }
#assistOverlay { position: fixed; inset: 0; z-index: 9500; background: rgba(15,17,17,.85); display: flex; align-items: center; justify-content: center; padding: 16px; }
.assist-card { background: #232F3E; border-radius: 14px; padding: 20px 18px; max-width: 440px; width: 100%; border-top: 6px solid #c7254e; }
.assist-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.assist-desc { font-size: 14px; color: #c7d0dc; margin-bottom: 12px; }
.assist-levels { display: grid; gap: 8px; margin-bottom: 10px; }
.as-level { text-align: left; background: #37475A; border: 2px solid transparent; border-radius: 10px; padding: 10px 12px; color: #fff; cursor: pointer; font-size: 15px; font-weight: 700; }
.as-level small { display: block; font-weight: 400; font-size: 12px; color: #c7d0dc; }
.as-level.sel { border-color: #fff; }
.as-level.leve.sel { background: #067D62; } .as-level.moderado.sel { background: #FA8900; color: #0F1111; } .as-level.moderado.sel small { color: #0F1111; } .as-level.urgente.sel { background: #c7254e; }
.assist-row { display: flex; gap: 10px; }
.as-cancel { background: #37475A; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
#callOverlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #ff9900; animation: callBlink 0.9s steps(2, end) infinite; padding: 20px; }
@keyframes callBlink { 0% { background: #ff9900; } 50% { background: #0F1111; } 100% { background: #ff9900; } }
.call-card { background: #fff; color: #0F1111; border-radius: 16px; padding: 28px 22px; text-align: center; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.call-title { font-size: 34px; font-weight: 900; margin-bottom: 12px; line-height: 1.1; }
.call-desc { font-size: 18px; line-height: 1.4; margin-bottom: 22px; }
#btnCallOk { width: 100%; padding: 16px; font-size: 20px; font-weight: 700; background: #0F1111; color: #ff9900; border: none; border-radius: 12px; cursor: pointer; }
.sdt-line { margin-top: 10px; padding: 8px 12px; background: #0F1111; border-radius: 8px; color: #fff; display: inline-block; }
.door-big { font-size: 44px; font-weight: 800; letter-spacing: 2px; color: #ff9900; background: #0F1111; border: 2px solid #ff9900; border-radius: 12px; padding: 10px 18px; display: inline-block; margin: 8px 0 12px; }
</style>
</head>

/* ===================== CONSTRUCCIÓN DINÁMICA DEL RECORRIDO ===================== */
function generarPasos(camion) {
  const T = STEP_TEXT[currentLang];
  const pasos = [];

  const g = T.garita(camion.carril);
  pasos.push({ id: "garita", ...g, ubicacion: entrada, tipoLocation: null });

  if (camion.usaPrecheck) {
    const p = T.precheck(camion.precheck.code);
    pasos.push({ id: "precheck", ...p, ubicacion: camion.precheck, tipoLocation: "virtual" });
  }

  camion.paradas.forEach((parada, i) => {
    const cod = parada.ubicacion.code;
    const esUltima = i === camion.paradas.length - 1;

    if (parada.esperaPrevia) {
      const motivo = T.motivos[parada.esperaPrevia.motivoKey] || "";
      const e = T.espera(parada.esperaPrevia.code, motivo);
      pasos.push({ id: `espera_${i}`, ...e, ubicacion: parada.esperaPrevia, tipoLocation: "virtual" });
    }

    const tr = T.transito(cod, parada.tipoLocation);
    pasos.push({ id: `transito_${i}`, ...tr, ubicacion: parada.ubicacion, tipoLocation: parada.tipoLocation, ruta: true });

    pasos.push({
      id: `proceso_${i}`,
      titulo: T.accionTitulo[parada.accion] + ` &middot; ${cod}`,
      corto: T.accionTitulo[parada.accion],
      desc: null,
      pasosDetalle: T.pasosDeAccion(parada.accion, cod, parada.altura),
      ubicacion: parada.ubicacion,
      tipoLocation: parada.tipoLocation,
      timer: true
    });

    const f = T.fin(cod, esUltima);
    pasos.push({ id: `fin_${i}`, ...f, ubicacion: parada.ubicacion, tipoLocation: parada.tipoLocation });
  });

  const s = T.salida();
  pasos.push({ id: "salida", ...s, ubicacion: entrada, tipoLocation: null });

  return pasos;
}

/* Camion real (sin ruta de demo): la fase se deduce del estado que llega de ODM via Firebase.
   Fases: 0 garita -> 1 muelle -> 2 sala de espera -> 3 llaves y salida */
function faseDesdeEstado(data) {
  if (!data) return 0;
  if (data.called) return 3;
  const fill = typeof data.fill === 'number' ? data.fill : null;
  const st = (data.status || '').toUpperCase();
  if (!data.door && !st && fill === null) return 0; // acreditado en garita (Sesame) pero ODM aun no le ha dado destino
  if (st === 'LOADING_IN_PROGRESS' || (fill !== null && fill > 0)) return 2;
  if (st === 'SCHEDULED' || fill === 0) return 1;
  return 1;
}

/* Subpasos dentro de una fase real (el conductor avanza con "Siguiente"); se guardan por VRID.
   Fase 1: 0 ir al muelle, 1 dejar llaves, 2 ir a la sala.  Fase 3: 0 recoger llaves, 1 volver al camion, 2 salida. */
/* Virtuales (PS): 0 ir a la plaza, 1 remolque suelto: elegir, 2 salir del recinto, 3 esperar con la tractora. Precheck (PC): 1 pantalla de espera. */
function tipoDestino(door) { const d = geoResolver(door); return d ? d.tipo : null; }
function subN(fase, door) {
  const t = tipoDestino(door);
  if (fase >= 1 && t === 'pc') return 1;
  if (fase >= 1 && t === 'ps') return 4;
  return fase === 1 || fase === 3 ? 3 : 1;
}
function subPasoActual(vrId, fase, door) {
  const raw = localStorage.getItem('bcn1_sub_' + vrId) || '';
  const [f, dr, i] = raw.split(':');
  if (Number(f) !== fase || (dr || '') !== (door || '')) { localStorage.setItem('bcn1_sub_' + vrId, fase + ':' + (door || '') + ':0'); return 0; }
  return Math.min(Math.max(Number(i) || 0, 0), subN(fase, door) - 1);
}
function irSubPaso(target) {
  const camion = window.__camionActual; if (!camion) return;
  const data = window.__tomYardLastData;
  const fase = faseDesdeEstado(data), door = data && data.door ? String(data.door) : '';
  const cur = subPasoActual(camion.vrId, fase, door);
  let nx = typeof target === 'number' ? target : cur + (target === 'back' ? -1 : 1);
  if (target === 'back' && tipoDestino(door) === 'ps' && cur >= 2) nx = 1;
  nx = Math.min(Math.max(nx, 0), subN(fase, door) - 1);
  localStorage.setItem('bcn1_sub_' + camion.vrId, fase + ':' + door + ':' + nx);
  renderGenerico(data);
  mapWrap.scrollIntoView({ behavior: 'smooth' });
}

  else if (b.classList.contains('sub-next')) irSubPaso('next');

  const door = data && data.door ? String(data.door) : null;
  avisarCambioMuelle(camion.vrId, door);
  let html = `<span class="badge">${camion.vrId}</span>`;
  if (door && fase >= 1) html += `<span class="badge carril">${R.muelle.badge} ${door}</span>`;
  const sub = subPasoActual(camion.vrId, fase, door);
  const nSub = subN(fase, door);
  const tipo = tipoDestino(door);
  const S = UI[currentLang].sub;
  let btnNext = null, extraBtns = '';
  if (fase === 0) {
    const g = T.garita(null);
    html += `<h3>${g.titulo}</h3><p>${g.desc}</p>`;
  } else if (tipo === 'pc') {
    html += `<h3>${T.precheck(door).titulo}</h3><div class="door-big">${door}</div><p>${S.pcEspera}</p>`;
  } else if (tipo === 'ps' && sub === 0) {
    const tt = T.transito(door, 'virtual');
    html += `<h3>${tt.titulo}</h3><div class="door-big">${door}</div><p>${tt.desc}</p>`;
    btnNext = S.psSuelto;
  } else if (tipo === 'ps' && sub === 1) {
    html += `<h3>${S.psT}</h3>`;
    extraBtns = `<button type="button" data-to="2">${S.psSalir}</button><button type="button" data-to="3">${S.psParking}</button>`;
  } else if (tipo === 'ps' && sub === 2) {
    const puerta = geoRutaSalida(geoResolver(door), !!window.__salidaV2).puerta;
    html += `<h3>${T.salida().titulo} ${puerta}</h3><p>${T.salida().desc}</p><div class="sdt-line">🚪 <b>${T.salida().corto}: ${puerta}</b></div>`;
    extraBtns = `<button type="button" class="sub-fin">${UI[currentLang].btnSalido}</button>`;
  } else if (tipo === 'ps') {
    html += `<h3>${S.parkingT}</h3><p>${S.psParking.replace(' ▶', '')}</p>`;
  } else if (fase === 1 && sub === 0) {
    html += `<h3>${R.muelle.titulo}</h3>`;
    if (door) html += `<div class="door-big">${door}</div><p>${R.muelle.conPuerta(door)}</p>`;
    else html += `<p>${R.muelle.intro}</p>`;
    html += '<ol>';
    T.pasosDeAccion('carga_vivo', '', '__ALTURA__')
      .filter(p => !p.includes('__ALTURA__'))
      .forEach(p => html += `<li>${p}</li>`);
    html += '</ol>';
    btnNext = S.aculado;
  } else if (fase === 1 && sub === 1) {
    html += `<h3>${S.dejarT}</h3><p>${S.dejarD}</p>`;
    btnNext = S.entregadas;
  } else if (fase === 1 || fase === 2) {
    html += `<h3>${fase === 1 ? S.irSala : R.sala.titulo}</h3><p>${R.sala.desc}</p>`;
    const hSdt = horaSdt(data && data.sdt);
    if (hSdt) html += `<div class="sdt-line">${UI[currentLang].salidaPrevista(hSdt)}</div>`;
  } else if (sub === 0) {
    html += `<h3>${S.recogerT}</h3><ol><li>${R.llaves.pasos[0]}</li></ol>`;
    btnNext = S.tengo;
  } else if (sub === 1) {
    html += `<h3>${S.volverT}</h3><ol><li>${R.llaves.pasos[1]}</li><li>${R.llaves.pasos[2]}</li></ol>`;
    btnNext = S.listo;
  } else {
    const puerta = geoRutaSalida(geoResolver(door), !!window.__salidaV2).puerta;
    html += `<h3>${T.salida().titulo} ${puerta}</h3><ol><li>${R.llaves.pasos[3]}</li></ol><div class="sdt-line">🚪 <b>${T.salida().corto}: ${puerta}</b></div>`;
    extraBtns = `<button type="button" class="sub-fin">${UI[currentLang].btnSalido}</button>`;
  }
  if (nSub > 1 && (sub > 0 || btnNext || extraBtns)) {
    html += '<div class="sub-nav">';
    if (sub > 0) html += `<button type="button" class="sub-back">${S.atras}</button>`;
    if (btnNext) html += `<button type="button" class="sub-next">${btnNext}</button>`;
    html += extraBtns + '</div>';
  }
  stepsDiv.innerHTML = html;
  mapWrap.classList.add('show');
  geoMostrar(fase, door, !!window.__salidaV2, sub);
  if (fase >= 1 && door) geoPedirConsentimiento(camion);
  renderFeedback((fase === 3 && sub === nSub - 1) || (tipo === 'ps' && sub >= 2));
  if (fase !== window.__ultimaFasePresencia) { window.__ultimaFasePresencia = fase; enviarPresencia(); }
}

/* ===================== PRESENCIA (latido a Firebase) ===================== */
function enviarPresencia() {
  const camion = window.__camionActual;
  if (!camion) return;
  const k = 'bcn1_first_' + camion.vrId;
  let firstTs = Number(localStorage.getItem(k));
  if (!firstTs) { firstTs = Date.now(); localStorage.setItem(k, String(firstTs)); }
  const fase = camion.esGenerico ? faseDesdeEstado(window.__tomYardLastData) : indiceActual;
  fetch(`${TOMYARD_URL}/presence/${encodeURIComponent(camion.vrId)}.json`, {
    method: 'PUT',
    body: JSON.stringify({ ts: Date.now(), lang: currentLang, fase, firstTs })
  }).catch(() => {});
}
let presenciaInterval = null;

function renderFeedback(mostrar) {
  const box = document.getElementById('fbBox');
  const camion = window.__camionActual;
  if (!mostrar || !camion) { box.style.display = 'none'; return; }
  const t = UI[currentLang];
  box.style.display = 'block';
  if (localStorage.getItem('bcn1_fb_' + camion.vrId)) {
    box.innerHTML = `<div class="fb-thanks">${t.fbGracias}</div>`;
    return;
  }
  if (box.dataset.vr === camion.vrId && box.dataset.lang === currentLang) return; // ya pintado, no perder lo escrito
  box.dataset.vr = camion.vrId; box.dataset.lang = currentLang;
  const caras = ['😕', '😐', '😊'];
  box.innerHTML = `<h4>${t.fbTitulo}</h4>
    <div class="fb-faces">${caras.map((cara, i) => `<button type="button" class="fb-face" data-r="${i + 1}"><span>${cara}</span>${t.fbCaras[i]}</button>`).join('')}</div>
    <textarea id="fbComment" rows="2" maxlength="600" placeholder="${t.fbComentario}"></textarea>
    <button type="button" class="fb-send" id="fbSend" disabled>${t.fbEnviar}</button>`;
  let rating = 0;
  box.querySelectorAll('.fb-face').forEach(b => b.addEventListener('click', () => {
    rating = Number(b.dataset.r);
    box.querySelectorAll('.fb-face').forEach(x => x.classList.toggle('sel', x === b));
    document.getElementById('fbSend').disabled = false;
  }));
  document.getElementById('fbSend').addEventListener('click', () => {
    if (!rating) return;

/* Hora de salida programada: llega de ODM como "29-Sep-26 13:00". Se muestra solo la hora;
   si es de otro dia se anade el dia. Si ya paso hace mas de 30 min, no se muestra. */
function horaSdt(sdt) {
  if (!sdt || typeof sdt !== 'string') return null;
  const m = sdt.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2})\s+(\d{1,2}:\d{2})$/);
  if (!m) return sdt;
  const meses = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
  const mes = meses[m[2].toLowerCase()];
  if (mes === undefined) return m[4];
  const [hh, mm] = m[4].split(':').map(Number);
  const d = new Date(2000 + Number(m[3]), mes, Number(m[1]), hh, mm);
  const ahora = new Date();
  if (ahora - d > 30 * 60 * 1000) return null;
  const mismoDia = d.toDateString() === ahora.toDateString();
  return mismoDia ? m[4] : `${m[1]}/${String(mes + 1).padStart(2, '0')} ${m[4]}`;
}

/* Aviso de llamada: pantalla completa parpadeando + sonido + vibracion, hasta que el conductor pulse OK. */
let audioCtx = null;
let callBeepTimer = null;
function desbloquearAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function pitido() {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.25, 0.5].forEach(off => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + off); o.stop(t0 + off + 0.2);
    });
  } catch (e) {}
}
// Si ODM/YMS cambian el destino mientras el conductor ya tiene uno, se le avisa (vibracion + pitido + aviso).
function avisarCambioMuelle(vrId, door) {
  if (!door) return;
  const k = 'bcn1_door_' + vrId;
  const prev = localStorage.getItem(k);
  localStorage.setItem(k, door);
  if (!prev || prev === door) return;
  const t = UI[currentLang];
  document.getElementById('callTitulo').textContent = t.doorChgT;
  document.getElementById('callDesc').textContent = t.doorChgD.replace('{a}', prev).replace('{b}', door);
  document.getElementById('btnCallOk').textContent = t.callOk;
  document.getElementById('btnCallOk').onclick = () => ocultarLlamada();
  document.getElementById('callOverlay').style.display = 'flex';
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600]);
  desbloquearAudio();
  pitido();
}
function mostrarLlamada(calledTs) {
  if (localStorage.getItem('bcn1_call_ack') === String(calledTs)) return;
  const t = UI[currentLang];
  document.getElementById('callTitulo').textContent = t.callTitulo;
  document.getElementById('callDesc').textContent = t.callDesc;
  document.getElementById('btnCallOk').textContent = t.callOk;
  document.getElementById('btnCallOk').onclick = () => {
    localStorage.setItem('bcn1_call_ack', String(calledTs));

  };
  document.getElementById('callOverlay').style.display = 'flex';
  document.title = t.callTitulo;
  if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400, 150, 800]);
  desbloquearAudio();
  pitido();
  clearInterval(callBeepTimer);
  let veces = 0;
  callBeepTimer = setInterval(() => {
    if (++veces > 20) { clearInterval(callBeepTimer); return; }
    pitido();
    if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
  }, 3000);
}
function ocultarLlamada() {
  clearInterval(callBeepTimer);
  document.getElementById('callOverlay').style.display = 'none';

/* Modo producción: el QR lleva directamente a ?vr=CODIGO, sin pasar por el desplegable.
   También soporta ?lang=XX para preseleccionar idioma (opcional, si el generador lo incluye). */
/* ===== ACCESO: solo con el camion acreditado en garita (existe en Firebase, < 24 h) y hasta que se le da salida ===== */
const ACRED_MAX_MS = 24 * 60 * 60 * 1000;
let acredTimer = null;
function mostrarBloqueo(tipo, vrId) {
  const t = UI[currentLang], en = UI.en;
  const fin = tipo === 'fin';
  document.getElementById('lockVr').textContent = vrId || '';
  document.getElementById('lockIcon').textContent = fin ? '✅' : '🔒';
  document.getElementById('lockT').textContent = fin ? t.lockFinT : t.lockAcredT;
  document.getElementById('lockD').textContent = fin ? t.lockFinD : t.lockAcredD;
  document.getElementById('lockEn').textContent = currentLang === 'en' ? '' : (fin ? en.lockFinD : en.lockAcredD);
  document.getElementById('lockOverlay').style.display = 'flex';
}
function ocultarBloqueo() { document.getElementById('lockOverlay').style.display = 'none'; }
function estaAcreditado(data) { return !!(data && data.ts && Date.now() - data.ts < ACRED_MAX_MS && !data.fin); }
function verificarAcreditacion(vrId) {
  clearTimeout(acredTimer);
  const finLocal = Number(localStorage.getItem('bcn1_fin_' + vrId)) || 0;
  if (finLocal) mostrarBloqueo('fin', vrId);
  fetch(`${TOMYARD_URL}/trucks/${encodeURIComponent(vrId)}.json`, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && data.fin) { finalizarRecorrido(false); return; }
      if (finLocal) {
        // El panel ha reabierto el enlace despues de que el conductor lo cerrara
        if (data && data.reopenTs && data.reopenTs > finLocal) localStorage.removeItem('bcn1_fin_' + vrId);
        else { acredTimer = setTimeout(() => verificarAcreditacion(vrId), 15000); return; }
      }
      if (estaAcreditado(data)) { ocultarBloqueo(); return; }
      mostrarBloqueo('acred', vrId);
      acredTimer = setTimeout(() => verificarAcreditacion(vrId), 15000);
    })
    .catch(() => { mostrarBloqueo('acred', vrId); acredTimer = setTimeout(() => verificarAcreditacion(vrId), 15000); });
}
/* Fin del recorrido: lo marca el conductor (boton), el panel (campo fin) o la salida del recinto con GPS. Desde entonces el enlace queda cerrado en este movil. */
function finalizarRecorrido(avisarServidor) {
  const vrId = window.__vrFromUrl || (window.__camionActual && window.__camionActual.vrId);
  if (!vrId) return;
  localStorage.setItem('bcn1_fin_' + vrId, String(Date.now()));
  clearInterval(tomYardInterval); clearInterval(presenciaInterval); clearTimeout(acredTimer);
  if (typeof geoParar === 'function') { geoParar(); if (geoRecheck) { clearInterval(geoRecheck); geoRecheck = null; } }
  ocultarLlamada();
  ['geoOverlay', 'assistOverlay'].forEach(id => document.getElementById(id).style.display = 'none');
  if (avisarServidor) fetch(`${TOMYARD_URL}/presence/${encodeURIComponent(vrId)}.json`, { method: 'PATCH', body: JSON.stringify({ ts: Date.now(), fase: 4 }) }).catch(() => {});
  mostrarBloqueo('fin', vrId);
}
function comprobarUrl() {
  const params = new URLSearchParams(window.location.search);
  const langFromUrl = params.get('lang');
  if (langFromUrl && LANGS.includes(langFromUrl) && langFromUrl !== currentLang) {
    currentLang = langFromUrl;
    localStorage.setItem('bcn1_lang', currentLang);
    pintarSelectorIdioma();
    pintarTextosEstaticos();
  }
  const codeFromUrl = params.get('vr');
  if (codeFromUrl) {
    if (!camiones[codeFromUrl]) {
      // VRID real (o ID de operacion sin VRID) que no esta en el set de demo:
      // se crea un camion generico, sin ruta detallada conocida, para no caer al selector manual.
      camiones[codeFromUrl] = {
        vrId: codeFromUrl,
        carril: null,
        usaPrecheck: false,
        precheck: null,
        paradas: [],
        esGenerico: true
      };
    }
    // Pantalla de inicio en produccion: VRID fijo (sin desplegable), seleccion de idioma y boton para empezar.
    window.__vrFromUrl = codeFromUrl;

/* ===================== MAPA SATELITE (Leaflet + Esri World Imagery) =====================
   Puntos medidos sobre Google Maps por el usuario y viales dibujados con geo/mapa-editor.html.
   Sin llamadas a sistemas internos: solo geometria del yard. */
const GEO_M_LAT = 111320, GEO_M_LON = 111320 * Math.cos(41.3146 * Math.PI / 180);
function geoDist(a, b) { return Math.hypot((b[0] - a[0]) * GEO_M_LAT, (b[1] - a[1]) * GEO_M_LON); }
function geoLerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
function geoUnit(a, b) { const d = geoDist(a, b); return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; }
function geoMove(p, u, m) { return [p[0] + u[0] * m, p[1] + u[1] * m]; }

const GEO_FIJO = {
  garitaV0: [41.314100, 2.077853], garitaV2: [41.314841, 2.073871],
  compact: [41.315239, 2.077016], rampa: [41.315143, 2.076747],

}
function geoPosicion(pos) {
  const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = Math.round(pos.coords.accuracy || 0);
  geoInit(); if (!geoMap) return;
  const ll = [lat, lon];
  if (!geoMeMarker) {
    geoMeMarker = L.marker(ll, { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'geo-dot', iconSize: [18, 18] }) }).addTo(geoMap);
    geoMeCircle = L.circle(ll, { radius: acc, color: '#1a73e8', weight: 1, fillOpacity: .12, interactive: false }).addTo(geoMap);
  } else { geoMeMarker.setLatLng(ll); geoMeCircle.setLatLng(ll).setRadius(acc); }
  if (!geoDentro(lat, lon)) { geoFuera(); return; } // fuera del recinto: no se guarda nada y se deja de seguir
  geoEstuvoDentro = true; geoChip(true);
  const c = window.__camionActual; if (!c) return;
  const now = Date.now();
  if (geoLastSent && now - geoLastSent.ts < 10000 && geoDist([geoLastSent.lat, geoLastSent.lon], ll) < 5) return;
  geoLastSent = { lat, lon, ts: now };
  fetch(`${TOMYARD_URL}/track/${encodeURIComponent(c.vrId)}/${now}.json`, { method: 'PUT', body: JSON.stringify({ lat: +lat.toFixed(6), lon: +lon.toFixed(6), acc, ts: now }) }).catch(() => {});
}


// Arranque: se ejecuta al final, cuando ya existen el mapa (zoom/pan) y todos los manejadores.
comprobarUrl();
</script>
