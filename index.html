<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BCN1 - Guía para camioneros</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #131A22;
    color: #f2f2f2;
  }
  header {
    background: #ff9900;
    color: #131A22;
    padding: 14px 16px;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
      position: relative;
  }
  .amz-smile {
    width: 90px;
    height: 16px;
    display: block;
    margin: 4px auto 0;
  }
  .lang-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  .lang-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid #37475A;
    background: #232F3E;
    color: #cfd3da;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  .lang-btn.active {
    background: #ff9900;
    color: #131A22;
    border-color: #ff9900;
  }
  .panel {
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #cfd3da;
  }
  select, button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    margin-bottom: 12px;
  }
  select {
    background: #232F3E;
    color: #fff;
    border: 1px solid #37475A;
  }
  button {
    background: #ff9900;
    color: #131A22;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .map-wrap {
    position: relative;
    max-width: 480px;
    height: 55vh;
    max-height: 460px;
    margin: 0 auto;
    border: 2px solid #37475A;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    touch-action: none;
    background: #0F1111;
  }
  .map-wrap.show { display: block; }
  .map-inner {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform;
    cursor: grab;
  }
  .map-inner.dragging { cursor: grabbing; }
  .map-inner img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .map-inner svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .map-controls {
    position: absolute;
    right: 10px; bottom: 10px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 5;
  }
  .map-controls button {
    width: 38px; height: 38px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    margin: 0;
    background: #232F3E;
    color: #fff;
    border: 1px solid #37475A;
  }
  .map-hint {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(20,24,31,0.75);
    color: #cfd3da;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    z-index: 5;
  }
  .marker-label {
    fill: #fff;
    font-size: 22px;
    font-weight: 700;
    paint-order: stroke;
    stroke: #000;
    stroke-width: 4px;
  }
  .stepper {
    max-width: 480px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    overflow-x: auto;
    gap: 6px;
  }
  .pill {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    background: #232F3E;
    color: #6b7280;
    border: 1px solid #37475A;
  }
  .pill.done { background: #0B3D2E; color: #3DDC97; border-color: #067D62; }
  .pill.actual { background: #ff9900; color: #131A22; border-color: #ff9900; }
  .steps {
    max-width: 480px;
    margin: 12px auto 0;
    background: #232F3E;
    border-radius: 10px;
    padding: 4px 16px;
    display: none;
  }
  .steps.show { display: block; }
  .steps h3 { color: #ff9900; margin-top: 14px; }
  .steps ol { padding-left: 20px; }
  .steps li { margin-bottom: 10px; line-height: 1.4; }
  .badge {
    display: inline-block;
    background: #ff9900;
    color: #131A22;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 10px;
    margin-right: 6px;
  }
  .badge.carril { background: #067D62; color: #3DDC97; }
  .timer {
    font-size: 26px;
    font-weight: 700;
    color: #00A8E1;
    margin: 8px 0;
  }
  .tomyard-box {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 16px;
  }
  .tomyard-line {
    background: #232F3E;
    border: 1px solid #37475A;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    color: #cfd3da;
    margin-bottom: 8px;
  }
  .tomyard-call {
    background: #3a1f1f;
    border: 1px solid #ff9900;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 700;
    color: #ffb84d;
    animation: tomyardPulse 1.2s infinite;
  }
  @keyframes tomyardPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .demo-controls {
    max-width: 480px;
    margin: 12px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
  }
  .demo-controls button {
    margin-bottom: 0;
    background: #232F3E;
    color: #ff9900;
    border: 1px solid #ff9900;
    font-size: 13px;
    padding: 10px;
  }
  .modo-nota {
    font-size: 11px;
    color: #6b7280;
    text-align: center;
    margin-top: 4px;
  }
  .safety-gate {
    max-width: 480px;
    margin: 16px auto 0;
    padding: 0 16px;
  }
  .gate-vrid {
    text-align: center;
    font-size: 13px;
    color: #ff9900;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .gate-map {
    background: #12151b;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 14px;
    text-align: center;
  }
  .gate-map img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 6px;
  }
  .gate-map-caption {
    font-size: 11px;
    color: #6b7280;
    margin-top: 6px;
  }
  .safety {
    padding: 14px 16px;
    background: #2a2210;
    border: 1px solid #7a5c1e;
    border-radius: 10px;
  }
  .safety h4 {
    margin: 0 0 8px 0;
    color: #ffcc66;
    font-size: 16px;
    text-align: center;
  }
  .safety-header {
    margin: 0 0 12px 0;
    font-size: 12px;
    line-height: 1.4;
    color: #ffcc66;
    background: #1f1a0c;
    border: 1px solid #5c4415;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .safety ol {
    margin: 0;
    padding-left: 20px;
  }
  .safety li {
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.45;
    color: #f0e6cf;
  }
  .safety-footer {
    margin: 12px 0 0 0;
    font-size: 12px;
    line-height: 1.4;
    color: #d8cba6;
    border-top: 1px solid #5c4415;
    padding-top: 10px;
  }
  .btn-confirmar {
    display: block;
    width: 100%;
    margin: 14px 0 24px;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    background: #ff9900;
    color: #11141a;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-confirmar:active { background: #FA8900; }
  .disclaimer {
    max-width: 480px;
    margin: 24px auto 40px;
    padding: 0 16px;
    font-size: 12px;
    color: #6b7280;
    text-align: center;
  }
.door-big { font-size: 44px; font-weight: 800; letter-spacing: 2px; color: #ff9900; background: #0F1111; border: 2px solid #ff9900; border-radius: 12px; padding: 10px 18px; display: inline-block; margin: 8px 0 12px; }
</style>
</head>
<body>

<header><span id="txtHeaderTitle"></span>

<div class="lang-bar" id="langBar"></div>

<div class="stepper" id="stepper"></div>

<div class="map-wrap" id="mapWrap">

<div class="steps" id="steps"></div>

</div>


<div class="disclaimer" id="txtDisclaimer"></div>

/* ===================== CONSTRUCCIÓN DINÁMICA DEL RECORRIDO ===================== */
function generarPasos(camion) {
  const T = STEP_TEXT[currentLang];
  const pasos = [];

  const g = T.garita(camion.carril);
  pasos.push({ id: "garita", ...g, ubicacion: entrada, tipoLocation: null });

  if (camion.usaPrecheck) {
    const p = T.precheck(camion.precheck.code);
    pasos.push({ id: "precheck", ...p, ubicacion: camion.precheck, tipoLocation: "virtual" });
  }

  camion.paradas.forEach((parada, i) => {
    const cod = parada.ubicacion.code;
    const esUltima = i === camion.paradas.length - 1;

    if (parada.esperaPrevia) {
      const motivo = T.motivos[parada.esperaPrevia.motivoKey] || "";
      const e = T.espera(parada.esperaPrevia.code, motivo);
      pasos.push({ id: `espera_${i}`, ...e, ubicacion: parada.esperaPrevia, tipoLocation: "virtual" });
    }

    const tr = T.transito(cod, parada.tipoLocation);
    pasos.push({ id: `transito_${i}`, ...tr, ubicacion: parada.ubicacion, tipoLocation: parada.tipoLocation, ruta: true });

    pasos.push({
      id: `proceso_${i}`,
      titulo: T.accionTitulo[parada.accion] + ` &middot; ${cod}`,
      corto: T.accionTitulo[parada.accion],
      desc: null,
      pasosDetalle: T.pasosDeAccion(parada.accion, cod, parada.altura),
      ubicacion: parada.ubicacion,
      tipoLocation: parada.tipoLocation,
      timer: true
    });

    const f = T.fin(cod, esUltima);
    pasos.push({ id: `fin_${i}`, ...f, ubicacion: parada.ubicacion, tipoLocation: parada.tipoLocation });
  });

  const s = T.salida();
  pasos.push({ id: "salida", ...s, ubicacion: entrada, tipoLocation: null });

  return pasos;
}

/* ===================== NORMAS DE SEGURIDAD: PASO OBLIGATORIO ANTES DEL RECORRIDO =====================
   Cada VRID debe leer y aceptar las normas antes de ver su recorrido. La aceptación se guarda en
   localStorage junto con la fecha/hora y el idioma, simulando el registro que en producción quedaría
   asociado a esa VRID en el sistema (para poder demostrar que el conductor confirmó haberlas leído). */
function haAceptadoNormas(vrId) {
  return !!localStorage.getItem('bcn1_accept_' + vrId);
}

function renderTomYard(data) {
  window.__tomYardLastData = data;
  const camionAct = window.__camionActual;
  if (camionAct && camionAct.esGenerico) renderGenerico(data);
  const box = document.getElementById('tomYardBox');
  if (!box) return;
  const t = UI[currentLang];
  if (!data) { box.style.display = 'none'; return; }

  let html = '';
  if (typeof data.fill === 'number') {
    if ((data.status || '').toUpperCase() === 'FINISHED_LOADING') html += `<div class="tomyard-line">${t.tomYardTerminada}</div>`;
    else if (data.fill >= 95) html += `<div class="tomyard-line">${t.tomYardListo}</div>`;
    else if (data.status === 'SCHEDULED') html += `<div class="tomyard-line">${t.tomYardEsperando}</div>`;
    else html += `<div class="tomyard-line">${t.tomYardCargando(data.fill)}</div>`;
  }
  if (data.called) {
    html += `<div class="tomyard-call">${t.tomYardLlamada}</div>`;
    if (data.calledTs && data.calledTs !== window.__tomYardLastCalledTs) {
      window.__tomYardLastCalledTs = data.calledTs;
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    }
  }
  if (!html) { box.style.display = 'none'; return; }
  box.innerHTML = html;
  box.style.display = 'block';
}


/* Camion real (sin ruta de demo): la fase se deduce del estado que llega de ODM via Firebase.
   Fases: 0 garita -> 1 muelle -> 2 sala de espera -> 3 llaves y salida */
function faseDesdeEstado(data) {
  if (!data) return 0;
  if (data.called) return 3;
  const fill = typeof data.fill === 'number' ? data.fill : null;
  const st = (data.status || '').toUpperCase();
  if (st === 'LOADING_IN_PROGRESS' || (fill !== null && fill > 0)) return 2;
  if (st === 'SCHEDULED' || fill === 0) return 1;
  return 1;
}

function renderGenerico(data) {
  const camion = window.__camionActual;
  if (!camion) return;
  const T = STEP_TEXT[currentLang];
  const R = T.real;
  const fase = faseDesdeEstado(data);

  const fases = [
    { corto: T.garita(null).corto },
    { corto: R.muelle.corto },
    { corto: R.sala.corto },
    { corto: R.llaves.corto }
  ];
  stepperDiv.style.display = '';
  stepperDiv.innerHTML = '';
  fases.forEach((f, i) => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (i < fase ? ' done' : i === fase ? ' actual' : '');
    pill.textContent = f.corto;
    stepperDiv.appendChild(pill);
  });

  const door = data && data.door ? String(data.door) : null;
  let html = `<span class="badge">${camion.vrId}</span>`;
  if (door && fase >= 1) html += `<span class="badge carril">${R.muelle.badge} ${door}</span>`;
  if (fase === 0) {
    const g = T.garita(null);
    html += `<h3>${g.titulo}</h3><p>${g.desc}</p>`;
  } else if (fase === 1) {
    html += `<h3>${R.muelle.titulo}</h3>`;
    if (door) html += `<div class="door-big">${door}</div><p>${R.muelle.conPuerta(door)}</p>`;
    else html += `<p>${R.muelle.intro}</p>`;
    html += '<ol>';
    T.pasosDeAccion('carga_vivo', '', '__ALTURA__')
      .filter(p => !p.includes('__ALTURA__'))
      .forEach(p => html += `<li>${p}</li>`);
    html += '</ol>';
  } else if (fase === 2) {
    html += `<h3>${R.sala.titulo}</h3><p>${R.sala.desc}</p>`;
  } else {
    html += `<h3>${R.llaves.titulo}</h3><ol>`;
    R.llaves.pasos.forEach(p => html += `<li>${p}</li>`);
    html += '</ol>';
  }
  stepsDiv.innerHTML = html;
}

function pollTomYard() {
  const camion = window.__camionActual;
  if (!camion) return;
  fetch(`${TOMYARD_URL}/trucks/${encodeURIComponent(camion.vrId)}.json`)
    .then(r => r.ok ? r.json() : null)
    .then(data => renderTomYard(data))
    .catch(() => {});
}

function iniciarRecorrido(camion) {
  pasosActuales = generarPasos(camion);
  indiceActual = 0;
  window.__camionActual = camion;
  // Camion generico (VRID real sin ruta conocida): no se muestran etapas inventadas,
  // solo el estado real que llega de Firebase.
  demoControls.style.display = camion.esGenerico ? 'none' : 'flex';
  renderTodo();
  mapWrap.scrollIntoView({ behavior: 'smooth' });

  window.__tomYardLastCalledTs = 0;
  clearInterval(tomYardInterval);
  pollTomYard();
  tomYardInterval = setInterval(pollTomYard, 15000);
}

function renderTodo() {
  renderStepper();
  renderPasoActual();
}

function renderStepper() {
  stepperDiv.innerHTML = '';
  pasosActuales.forEach((p, i) => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (i < indiceActual ? ' done' : i === indiceActual ? ' actual' : '');
    pill.textContent = p.corto;
    stepperDiv.appendChild(pill);
  });
}

function renderPasoActual() {
  const paso = pasosActuales[indiceActual];
  const camion = window.__camionActual;

  mapWrap.classList.add('show');
  stepsDiv.classList.add('show');

  const origen = indiceActual > 0 ? pasosActuales[indiceActual - 1].ubicacion : entrada;
  drawEtapa(origen, paso);
  resetView();
  requestAnimationFrame(() => centerOn(paso.ubicacion.x, paso.ubicacion.y, 1.6));

  let html = `<span class="badge">${camion.vrId}</span>` + (camion.carril ? `<span class="badge carril">${UI[currentLang].badgeCarril} ${camion.carril}</span>` : '');
  if (camion.esGenerico) {
    renderGenerico(window.__tomYardLastData);
    return;
  }
  html += `<h3>${paso.titulo}</h3>`;
  if (paso.desc) html += `<p>${paso.desc}</p>`;
  if (paso.pasosDetalle) {
    html += '<ol>';
    paso.pasosDetalle.forEach(p => html += `<li>${p}</li>`);
    html += '</ol>';
  }
  if (paso.timer) {
    html += `<div class="timer" id="timerDisplay">00:00</div><p style="font-size:12px;color:#6b7280;">${UI[currentLang].timerNote}</p>`;
  }
  stepsDiv.innerHTML = html;

  clearInterval(timerInterval);
  if (paso.timer) {
    timerSegundos = 0;
    timerInterval = setInterval(() => {
      timerSegundos++;
      const min = String(Math.floor(timerSegundos / 60)).padStart(2, '0');
      const seg = String(timerSegundos % 60).padStart(2, '0');
      const disp = document.getElementById('timerDisplay');
      if (disp) disp.textContent = `${min}:${seg}`;
    }, 1000);
  }
}

document.getElementById('btnSiguiente').addEventListener('click', () => {
  if (indiceActual < pasosActuales.length - 1) {
    indiceActual++;
    renderTodo();
  }
});
document.getElementById('btnAnterior').addEventListener('click', () => {
  if (indiceActual > 0) {

});

  document.getElementById('btnVer').textContent = t.btnVer;

  document.getElementById('txtMapHint').textContent = t.mapHint;
  document.getElementById('btnAnterior').textContent = t.btnAnterior;
  document.getElementById('btnSiguiente').textContent = t.btnSiguiente;
  document.getElementById('txtDisclaimer').textContent = t.disclaimer;

  const select = document.getElementById('destino');
  const valorPrevio = select.value;
  select.innerHTML = '';
  const optPlaceholder = document.createElement('option');
  optPlaceholder.value = '';
  optPlaceholder.textContent = t.selectPlaceholder;
  select.appendChild(optPlaceholder);
  Object.keys(t.demoOptions).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = t.demoOptions[code];
    select.appendChild(opt);
  });
  select.value = valorPrevio;

  if (document.getElementById('safetyGate').style.display !== 'none' && window.__pendingCamion) {
    pintarGateSeguridad(window.__pendingCamion);
  }
}

function cambiarIdioma(lang) {
  if (!LANGS.includes(lang)) return;
  currentLang = lang;
  localStorage.setItem('bcn1_lang', lang);
  pintarSelectorIdioma();
  pintarTextosEstaticos();
  if (window.__camionActual) {
    pasosActuales = generarPasos(window.__camionActual);
    renderTodo();
    renderTomYard(window.__tomYardLastData);
  }
}

pintarSelectorIdioma();
pintarTextosEstaticos();

/* Modo producción: el QR lleva directamente a ?vr=CODIGO, sin pasar por el desplegable.
   También soporta ?lang=XX para preseleccionar idioma (opcional, si el generador lo incluye). */
(function comprobarUrl() {
  const params = new URLSearchParams(window.location.search);
  const langFromUrl = params.get('lang');
  if (langFromUrl && LANGS.includes(langFromUrl) && langFromUrl !== currentLang) {
    currentLang = langFromUrl;
    localStorage.setItem('bcn1_lang', currentLang);
    pintarSelectorIdioma();
    pintarTextosEstaticos();
  }
  const codeFromUrl = params.get('vr');
  if (codeFromUrl) {
    if (!camiones[codeFromUrl]) {
      // VRID real (o ID de operacion sin VRID) que no esta en el set de demo:
      // se crea un camion generico, sin ruta detallada conocida, para no caer al selector manual.
      camiones[codeFromUrl] = {
        vrId: codeFromUrl,
        carril: null,
        usaPrecheck: false,
        precheck: null,
        paradas: [],
        esGenerico: true
      };
    }
    document.getElementById('panelManual').style.display = 'none';
    mostrarCamion(codeFromUrl);
  }
})();

/* ===================== DIBUJO EN EL MAPA ===================== */
function drawEtapa(origen, paso) {
  svg.innerHTML = '';
  const to = paso.ubicacion;

  if (paso.ruta) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const midX = (origen.x + to.x) / 2;
    const d = `M ${origen.x} ${origen.y} Q ${midX} ${origen.y}, ${to.x} ${to.y}`;
    path.setAttribute('d', d);
    path.setAttribute('stroke', '#00A8E1');
    path.setAttribute('stroke-width', '6');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-dasharray', '4 10');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);
    addMarker(origen.x, origen.y, '#6b7280', origen.code || '');
  }

  addMarker(to.x, to.y, '#ff9900', to.code || '');
}

function addMarker(x, y, color, label) {
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', x);
  circle.setAttribute('cy', y);
  circle.setAttribute('r', 14);
  circle.setAttribute('fill', color);
  circle.setAttribute('stroke', '#000');
  circle.setAttribute('stroke-width', '2');
  svg.appendChild(circle);

  if (label) {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y - 20);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'marker-label');
    text.textContent = label;
    svg.appendChild(text);
  }
}

/* ===================== ZOOM & PAN TIPO MAPS ===================== */
const mapInner = document.getElementById('mapInner');
const IMG_W = 654, IMG_H = 527;
let scale = 1, minScale = 1, maxScale = 4;
let posX = 0, posY = 0;
let dragging = false, lastX = 0, lastY = 0;
let pinchStartDist = 0, pinchStartScale = 1;

function applyTransform() {
  mapInner.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

function clampPan() {
  const rect = mapWrap.getBoundingClientRect();
  const scaledW = rect.width * scale;
  const scaledH = rect.height * scale;
  const minX = Math.min(0, rect.width - scaledW);
  const minY = Math.min(0, rect.height - scaledH);
  posX = Math.min(0, Math.max(posX, minX));
  posY = Math.min(0, Math.max(posY, minY));
}

function resetView() {
  scale = 1; posX = 0; posY = 0;
  applyTransform();
}

function centerOn(imgX, imgY, targetScale) {
  const rect = mapWrap.getBoundingClientRect();
  scale = Math.min(Math.max(targetScale, minScale), maxScale);
  const px = (imgX / IMG_W) * rect.width;
  const py = (imgY / IMG_H) * rect.height;
  posX = rect.width / 2 - px * scale;
  posY = rect.height / 2 - py * scale;
  clampPan();
  applyTransform();
}

function zoomBy(factor, cx, cy) {
  const rect = mapWrap.getBoundingClientRect();
  const originX = cx !== undefined ? cx : rect.width / 2;
  const originY = cy !== undefined ? cy : rect.height / 2;
  const newScale = Math.min(Math.max(scale * factor, minScale), maxScale);
  const ratio = newScale / scale;
  posX = originX - (originX - posX) * ratio;
  posY = originY - (originY - posY) * ratio;
  scale = newScale;
  clampPan();
  applyTransform();
}

mapWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = mapWrap.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, cx, cy);
}, { passive: false });

mapWrap.addEventListener('mousedown', (e) => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  mapInner.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  posX += e.clientX - lastX;
  posY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  clampPan();
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  mapInner.classList.remove('dragging');
});

mapWrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    pinchStartDist = touchDist(e.touches);
    pinchStartScale = scale;
  }
}, { passive: true });

mapWrap.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    posX += dx; posY += dy;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    clampPan();
    applyTransform();
  } else if (e.touches.length === 2) {
    const dist = touchDist(e.touches);
    const factor = dist / pinchStartDist;
    const rect = mapWrap.getBoundingClientRect();
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    scale = Math.min(Math.max(pinchStartScale * factor, minScale), maxScale);
    posX = midX - (midX - posX);
    posY = midY - (midY - posY);
    clampPan();
    applyTransform();
  }
}, { passive: true });

mapWrap.addEventListener('touchend', () => { dragging = false; });

function touchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

document.getElementById('zoomIn').addEventListener('click', () => zoomBy(1.3));
document.getElementById('zoomOut').addEventListener('click', () => zoomBy(1/1.3));
document.getElementById('zoomReset').addEventListener('click', resetView);
</script>
