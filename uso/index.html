<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>BCN1 Suite - Uso</title>
<style>
:root{color-scheme:dark}
body{font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:#10151c;color:#e6edf3;margin:0;padding:20px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#9aa7b2;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button{background:#1b2430;color:#e6edf3;border:1px solid #30404f;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.active{background:#2d7dd2;border-color:#2d7dd2}
.tabs button{font-weight:600}
.card{background:#1b2430;border:1px solid #2a3542;border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
.card h2{font-size:14px;margin:0 0 10px;color:#cfe3ff}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #2a3542;white-space:nowrap}
th{color:#9aa7b2;font-weight:600}td.n{text-align:right}
td.z{color:#4a5563}
.warn{background:#3a2d12;border:1px solid #f0b429;color:#ffe3a0;border-radius:8px;padding:8px 12px;margin-bottom:8px}
.ok{background:#12301f;border:1px solid #2fa866;color:#b6f0cf;border-radius:8px;padding:8px 12px;margin-bottom:8px}
.kp{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.k{background:#1b2430;border:1px solid #2a3542;border-radius:12px;padding:10px 16px}
.k b{font-size:24px;display:block}.k span{color:#9aa7b2;font-size:12px}
.bw{background:#2d7dd2;height:10px;border-radius:5px;display:inline-block;vertical-align:middle}
.err{color:#ff8a8a;background:#2a1a1a;border:1px solid #5a2a2a;border-radius:8px;padding:10px;margin-bottom:14px}
.muted{color:#6b7684;font-size:12px}
</style></head><body>
<h1>BCN1 Suite &middot; quien usa que</h1>
<div class="sub">Por cada herramienta: quien la usa, cuantas veces y que botones pulsa.</div>
<div id="errBox"></div>
<div class="bar" id="tabs"></div>
<div class="bar" id="per">
 <span>Periodo:</span>
 <button data-d="1">Hoy</button><button data-d="7" class="active">7 dias</button><button data-d="30">30 dias</button><button data-d="0">Todo</button>
 <span style="flex:1"></span><button id="rel">Recargar</button></div>
<div class="card"><h2>Mejoras con Quick</h2><button id="qk">Pedir mejoras a Quick (copia los datos y abre Quick)</button> <span class="muted" id="qkm"></span></div>
<div id="out"></div>
<p class="muted" id="foot"></p>
<script>
const FB='https://tom-yard-default-rtdb.europe-west1.firebasedatabase.app/candados/pc.json';
const MODS=[['resumen','Resumen'],['outlook','Correo (Yard Health)'],['investigador','Investigador'],['perfectmile','PerfectMile'],['yardhealth_o_cantina','YMS'],['odm','ODM']];
// accion "mira" y accion "hace" por herramienta para detectar quien mira pero no actua
const EMBUDO={investigador:{mira:['Investigar'],hace:['Publicar en Relay'],txt:['investiga','publica en Relay']},
 outlook:{mira:['Generar EOS desde YMS, FCLM y FMC (Mayus'],hace:['Abrir el borrador'],txt:['genera el EOS','abre el borrador del correo']}};
// botones que significan USO REAL (no solo que el script se abra al entrar en la pagina)
const REAL={investigador:['Investigar','Generar comentario','Publicar en Relay'],outlook:['Generar EOS desde YMS, FCLM y FMC (Mayus','Abrir el borrador','Cargar o editar el plan semanal de camio'],perfectmile:['📋 Rellenar todo','Aplicar','Aplicar todas','Rellenar'],yardhealth_o_cantina:[],odm:[]};
const RUIDO=/^(Entendido|Cerrar panel|Cerrar|✕ CERRAR|Actualizar ahora|⬆ Actualizar ahora|Cancelar)$/;
function realCount(a,mod){const R=REAL[mod]||[];return Object.entries(a).reduce((n,[k,v])=>n+(R.some(r=>k.startsWith(r))?v:0),0)}
let RAW=[],DAYS=7,TAB='resumen';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function load(){
 document.getElementById('errBox').innerHTML='';
 try{const r=await fetch(FB,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();RAW=[];
  Object.values(d||{}).forEach(u=>{if(!u||u.state!=='uso'||!u.uso)return;Object.entries(u.uso).forEach(([day,o])=>Object.values(o||{}).forEach(e=>{if(e&&e.login&&e.modulo)RAW.push(Object.assign({day},e))}))});
  document.getElementById('foot').textContent=RAW.length+' eventos guardados. Leido a las '+new Date().toLocaleTimeString('es-ES');render();
 }catch(e){document.getElementById('errBox').innerHTML='<div class="err">No se pudo leer: '+esc(e.message||e)+'</div>'}}
const data=()=>DAYS?RAW.filter(e=>(e.ts||0)>=Date.now()-DAYS*864e5):RAW;
function userTable(ev,mod){
 const users={},acts={};
 ev.forEach(e=>{const u=users[e.login]||(users[e.login]={abre:0,clics:0,last:0,a:{}});
  if(e.accion==='carga')u.abre++;else if(e.accion==='clic'&&e.extra){u.clics++;u.a[e.extra]=(u.a[e.extra]||0)+1;acts[e.extra]=(acts[e.extra]||0)+1}
  u.last=Math.max(u.last,e.ts||0)});
 const L=Object.keys(users).sort((a,b)=>(users[b].abre+users[b].clics)-(users[a].abre+users[a].clics));
 const A=Object.keys(acts).filter(a=>!RUIDO.test(a)).sort((a,b)=>acts[b]-acts[a]);
 let h='';
 const em=EMBUDO[mod];
 if(em&&L.length){const solo=L.filter(l=>em.mira.some(m=>users[l].a[m])&&!em.hace.some(m=>users[l].a[m]));
  const si=L.filter(l=>em.hace.some(m=>users[l].a[m]));
  if(solo.length)h+='<div class="warn"><b>Miran pero no '+em.txt[1]+':</b> '+solo.map(esc).join(', ')+'</div>';
  if(si.length)h+='<div class="ok"><b>Si '+em.txt[1]+':</b> '+si.map(esc).join(', ')+'</div>';}
 h+='<div class="card"><h2>Quien lo usa</h2>'+(L.length?'<table><tr><th>Login</th><th>Se le abre (entra en la pagina)</th><th>Uso real (acciones)</th><th>Veredicto</th><th>Ultima vez</th></tr>'+L.map(l=>{const r=realCount(users[l].a,mod);const v=r>=5?'<b style="color:#7dde9c">Lo usa</b>':r>0?'<span style="color:#ffd27a">Lo prueba poco</span>':'<span style="color:#ff8a8a">Solo se le abre</span>';return '<tr><td>'+esc(l)+'</td><td class="n">'+users[l].abre+'</td><td class="n"><b>'+r+'</b></td><td>'+v+'</td><td>'+fmt(users[l].last)+'</td></tr>'}).join('')+'</table><div class="muted" style="margin-top:6px">Uso real = pulsar botones que hacen algo ('+esc((REAL[mod]||[]).join(', ')||'ninguno definido')+'). Se le abre = el script arranca solo al entrar en la pagina; eso no cuenta como uso.</div>':'<span class="muted">Sin datos en este periodo</span>')+'</div>';
 if(A.length){const mx=acts[A[0]];
  h+='<div class="card"><h2>Que botones usa cada uno (quien pulsa que)</h2><table><tr><th>Boton</th><th>Total</th>'+L.map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr>'+
  A.map(a=>'<tr><td>'+esc(a)+'</td><td class="n"><b>'+acts[a]+'</b> <span class="bw" style="width:'+Math.round(acts[a]/mx*80)+'px"></span></td>'+L.map(l=>{const v=users[l].a[a]||0;return '<td class="n'+(v?'':' z')+'">'+v+'</td>'}).join('')+'</tr>').join('')+'</table></div>';}
 else h+='<div class="card"><span class="muted">Todavia no hay clics en botones en este periodo.</span></div>';
 return h}
function render(){
 document.getElementById('tabs').innerHTML=MODS.map(([k,n])=>'<button class="tabs'+(k===TAB?' active':'')+'" data-t="'+k+'">'+n+'</button>').join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render()});
 const ev=data();let h='';
 if(TAB==='resumen'){
  const us=new Set(ev.map(e=>e.login));
  h+='<div class="kp"><div class="k"><b>'+us.size+'</b><span>usuarios</span></div><div class="k"><b>'+ev.length+'</b><span>eventos</span></div></div>';
  h+='<div class="card"><h2>Herramienta x usuario: uso real / veces que se le abre</h2>';
  const U=[...us].sort();
  h+=U.length?'<table><tr><th>Herramienta</th>'+U.map(u=>'<th>'+esc(u)+'</th>').join('')+'<th>Total</th></tr>'+
   MODS.slice(1).map(([k,n])=>{const e2=ev.filter(e=>e.modulo===k);return '<tr><td>'+n+'</td>'+U.map(u=>{const e3=e2.filter(e=>e.login===u);const ab=e3.filter(e=>e.accion==='carga').length;const a={};e3.forEach(e=>{if(e.extra)a[e.extra]=(a[e.extra]||0)+1});const r=realCount(a,k);return '<td class="n'+(ab||r?'':' z')+'">'+(r?'<b style="color:#7dde9c">'+r+'</b>':'<span style="color:#ff8a8a">0</span>')+' / '+ab+'</td>'}).join('')+'<td class="n"><b>'+e2.filter(e=>e.accion==='carga').length+'</b></td></tr>'}).join('')+'</table>':'<span class="muted">Sin datos en este periodo</span>';
  h+='</div>';
 } else h=userTable(ev.filter(e=>e.modulo===TAB),TAB);
 document.getElementById('out').innerHTML=h}
document.querySelectorAll('#per button[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#per button[data-d]').forEach(x=>x.classList.remove('active'));b.classList.add('active');DAYS=+b.dataset.d;render()});

function resumenTxt(){
 const ev=data();let t='';
 MODS.slice(1).forEach(([k,n])=>{const e2=ev.filter(e=>e.modulo===k);if(!e2.length)return;
  const us={},ac={};e2.forEach(e=>{const u=us[e.login]||(us[e.login]={abre:0,a:{}});if(e.accion==='carga')u.abre++;else if(e.extra){u.a[e.extra]=(u.a[e.extra]||0)+1;ac[e.extra]=(ac[e.extra]||0)+1}});
  t+='\n## '+n+'\n';Object.keys(us).forEach(l=>{t+='- '+l+': abre '+us[l].abre+' veces; botones: '+(Object.entries(us[l].a).map(([a,c])=>a+' x'+c).join(', ')||'ninguno')+'\n'});
  t+='Botones mas usados: '+(Object.entries(ac).sort((a,b)=>b[1]-a[1]).map(([a,c])=>a+' x'+c).join(', ')||'ninguno')+'\n'});
 return t||'\n(sin datos)\n'}
document.getElementById('qk').onclick=async()=>{
 const p='Eres analista de producto. Tengo unos userscripts (BCN1 Suite: Investigador FMC para investigar y publicar reportes de camiones tarde en Relay, PerfectMile para comentarios semanales, Yard Health para el informe por correo, ODM/YMS). Estos son los datos de uso de los ultimos '+(DAYS||'todos los')+' dias por usuario. Dime en espanol: 1) que herramientas y botones se usan poco o nada y por que puede ser, 2) donde hay usuarios que miran pero no completan la accion (por ejemplo investigan pero no publican) y que cambiaria para que lo hagan, 3) las 5 mejoras concretas que haria, ordenadas por impacto. Se breve y concreto.\n'+resumenTxt();
 try{await navigator.clipboard.writeText(p);document.getElementById('qkm').textContent='Copiado. Se abre Quick: pega con Ctrl+V.'}catch(e){document.getElementById('qkm').textContent='No pude copiar; abre Quick y pega a mano.'}
 window.open('https://us-east-1.quicksight.aws.amazon.com/sn/account/amazonbi','_blank')};
document.getElementById('rel').onclick=load;load();
</script></body></html>
